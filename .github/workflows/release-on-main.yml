name: Release On Main

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Tag, Release, And Sync
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            tag_commit="$(git rev-list -n 1 "refs/tags/$tag")"
            head_commit="$(git rev-parse HEAD)"
            if [[ "$tag_commit" != "$head_commit" ]]; then
              echo "Tag $tag already exists on $tag_commit. Skipping release automation for HEAD $head_commit."
              skip_release=true
            else
              create_tag=false
            fi
          else
            create_tag=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "create_tag=$create_tag" >> "$GITHUB_OUTPUT"
          echo "skip_release=${skip_release:-false}" >> "$GITHUB_OUTPUT"

      - name: Create annotated tag
        if: steps.version.outputs.create_tag == 'true' && steps.version.outputs.skip_release != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Install dependencies
        if: steps.version.outputs.skip_release != 'true'
        run: npm ci

      - name: Build release package
        if: steps.version.outputs.skip_release != 'true'
        run: npm run vscode:prepublish

      - name: Package VSIX
        if: steps.version.outputs.skip_release != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm exec --package @vscode/vsce -- vsce package --out "tcview-${{ steps.version.outputs.version }}.vsix"

      - name: Publish GitHub release
        if: steps.version.outputs.skip_release != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: tcview-${{ steps.version.outputs.version }}.vsix

      - name: Ensure main back-merge PR exists
        if: steps.version.outputs.skip_release != 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            try {
              await github.rest.repos.getBranch({ owner, repo, branch: 'develop' });
            } catch (error) {
              if (error.status === 404) {
                core.info('Skipping develop sync PR because develop does not exist yet.');
                return;
              }
              throw error;
            }

            const comparison = await github.rest.repos.compareCommits({
              owner,
              repo,
              base: 'develop',
              head: 'main'
            });

            if (comparison.data.ahead_by === 0) {
              core.info('No main -> develop sync needed.');
              return;
            }

            const openPrs = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              base: 'develop',
              head: `${owner}:main`
            });

            if (openPrs.data.length > 0) {
              core.info(`Open main -> develop sync PR already exists: #${openPrs.data[0].number}`);
              return;
            }

            const pull = await github.rest.pulls.create({
              owner,
              repo,
              head: 'main',
              base: 'develop',
              title: `Sync main back into develop after ${process.env.RELEASE_TAG}`,
              body: 'Automated GitFlow back-merge PR created after a release or hotfix landed on `main`.'
            });

            core.info(`Created main -> develop sync PR #${pull.data.number}`);
