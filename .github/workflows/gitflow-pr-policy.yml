name: GitFlow PR Policy

on:
  pull_request:
    branches:
      - main
      - develop
      - support/**
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review

jobs:
  validate:
    name: Validate GitFlow PR policy
    runs-on: ubuntu-latest

    steps:
      - name: Validate base and head branch pairing
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          allow_head_for_develop() {
            case "$1" in
              feature/*|bugfix/*|chore/*|docs/*|refactor/*|test/*|perf/*|main)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          if [[ "$BASE_REF" == "main" ]]; then
            case "$HEAD_REF" in
              release/*|hotfix/*)
                exit 0
                ;;
            esac
            echo "PRs into main must come from release/* or hotfix/* branches. Received: $HEAD_REF -> $BASE_REF" >&2
            exit 1
          fi

          if [[ "$BASE_REF" == "develop" ]]; then
            if allow_head_for_develop "$HEAD_REF"; then
              exit 0
            fi
            echo "PRs into develop must come from feature/*, bugfix/*, chore/*, docs/*, refactor/*, test/*, perf/*, or main. Received: $HEAD_REF -> $BASE_REF" >&2
            exit 1
          fi

          if [[ "$BASE_REF" == support/* ]]; then
            case "$HEAD_REF" in
              hotfix/*)
                exit 0
                ;;
            esac
            echo "PRs into support/* must come from hotfix/* branches. Received: $HEAD_REF -> $BASE_REF" >&2
            exit 1
          fi

          echo "No GitFlow policy rule matched for $HEAD_REF -> $BASE_REF" >&2
          exit 1
