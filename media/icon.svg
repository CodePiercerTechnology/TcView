             C-6 -4 -3 -6 0 -6
             C3 -6 6 -4 10 0
             C6 4 3 6 0 6
             C-3 6 -6 4 -10 0 Z"
          stroke="#CFCFCF"
          stroke-width="2.0"
          stroke-linejoin="round"
          fill="none"/>
    <!-- Centered iris -->
    <circle cx="0" cy="0" r="2.6" fill="#CFCFCF"/>
  </g>

</svg>