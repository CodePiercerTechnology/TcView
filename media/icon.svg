        font-family="Segoe UI, sans-serif"
        font-size="8.5"
        font-weight="775"
        fill="#CFCFCF">
    Tc
  </text>

  <!-- Properly centered eye -->
  <g transform="translate(12,13.7)">
    <!-- Symmetric eye outline centered on 0,0 -->
